name: EB deploy main CICD Pipeline update

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Zip application
        # Exclude .git folder, .github folder, and the zip itself to prevent bloat
        run: zip -r application.zip . -x "*.git*" "*.github*" "application.zip"

      - name: EB deploy
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          application_name: FogNEdge
          environment_name: FogNEdge-env
          version_label: v-${{ github.run_number }}
          region: us-east-1
          deployment_package: application.zip